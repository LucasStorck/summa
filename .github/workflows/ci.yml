name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm ci instala exatamente as versões do package-lock.json.
      # --ignore-scripts: o better-sqlite3 já traz binários prontos (prebuilds/),
      # então não precisa compilar nada; e nenhum pacote roda script na instalação.
      - run: npm ci --ignore-scripts

      # compila (o tsc também verifica os tipos) e roda os testes
      - run: npm test
